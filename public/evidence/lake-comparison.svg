<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">ATLAS simulated site measurements</title><desc id="desc">Two separate zero-based bar charts. Temperature: shaded stream 18 degrees Celsius; sunlit bay 28. Dissolved oxygen: shaded stream 8.8 milligrams per litre; sunlit bay 3.1. These are fictional game values, not real observations or a prediction.</desc>
<rect width="720" height="460" rx="24" fill="#f5f7fc"/>
<g font-family="system-ui,sans-serif" fill="#304660">
<text x="30" y="36" font-size="18" font-weight="700">SIMULATED GAME DATA · NOT REAL MEASUREMENTS</text>
<text x="30" y="80" font-size="20" font-weight="700">Temperature (°C) · scale 0–30</text>
<text x="30" y="124" font-size="16">Shaded stream</text><text x="30" y="174" font-size="16">Sunlit bay</text>
<path d="M190 91V192H640" fill="none" stroke="#8191a4"/>
<rect x="190" y="104" width="270" height="30" rx="5" fill="#27826b"/><rect x="190" y="154" width="420" height="30" rx="5" fill="#9160bf"/>
<text x="470" y="126" font-size="18">18</text><text x="620" y="176" font-size="18">28</text><text x="185" y="216" font-size="14">0</text><text x="628" y="216" font-size="14">30</text>
<text x="30" y="266" font-size="20" font-weight="700">Dissolved oxygen (mg/L) · scale 0–10</text>
<text x="30" y="310" font-size="16">Shaded stream</text><text x="30" y="360" font-size="16">Sunlit bay</text>
<path d="M190 277V378H640" fill="none" stroke="#8191a4"/>
<rect x="190" y="290" width="396" height="30" rx="5" fill="#27826b"/><rect x="190" y="340" width="139.5" height="30" rx="5" fill="#9160bf"/>
<text x="596" y="312" font-size="18">8.8</text><text x="340" y="362" font-size="18">3.1</text><text x="185" y="402" font-size="14">0</text><text x="628" y="402" font-size="14">10</text>
<text x="30" y="440" font-size="14">Original ATLAS chart · independent scales · no universal fish-safety threshold</text>
</g></svg>